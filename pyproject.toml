[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neoroute"
version = "0.1.0"
description = "A self-healing, Frontier model-compatible AI gateway MVP"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "httpx>=0.27,<1.0", "pydantic>=2.8,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<1.0", "ruff>=0.6,<1.0"]

[tool.setuptools.packages.find]
include = ["neoroute*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
